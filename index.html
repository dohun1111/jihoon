나는 뒤늦게 입술을 깨물었다.`}]}
];
const endings={happy:{name:'HAPPY ENDING · 교칙 위반, 둘이서',body:`“지훈아, 좋아해.”\n\n말이 끝나기도 전에 지훈이 웃었다. 울 것 같은 얼굴로.\n\n“그 말, 진짜죠?”\n\n“응. 이제 장난 안 쳐.”\n\n지훈이 내 손을 잡는다. 내가 먼저 손가락을 얽었다.\n\n누가 먼저 좋아했는지는 이제 중요하지 않다.\n\n우리는 같은 방향으로 걷기 시작했다.`},normal:{name:'NORMAL ENDING · 아직은 우리 사이',body:`지훈은 한참 생각하다가 고개를 끄덕였다.\n\n“조금만 천천히 가요, 형.”\n\n나는 웃었다. 이번에는 서두르지 않기로 했다.\n\n아직 연인은 아니다. 하지만 하교 길에 서로를 기다리는 사람은 되었다.\n\n우리 이야기는 아직 끝나지 않았다.`},bad1:{name:'BAD ENDING 1 · 닿지 못한 말',body:`“미안해요, 형.”\n\n지훈은 끝내 웃지 않았다.\n\n좋아한다고 말하기에는 너무 늦었고, 아무렇지 않은 척하기에는 이미 많은 걸 잃었다.\n\n복도에서 다시 마주치면 우리는 인사만 한다.\n\n김도훈 형. 그 호칭이 끝내 바뀌지 않았다.`},bad2:{name:'BAD ENDING 2 · 모르는 사람처럼',body:`지훈은 더는 나를 찾아오지 않는다.\n\n내 연락에는 답이 없고, 복도에서 눈이 마주쳐도 조용히 지나간다.\n\n“도훈아, 쟤랑 친하지 않았어?”\n\n나는 대답하지 못했다.\n\n이제 지훈에게 나는 선배도, 형도 아니다.\n\n그저 지나가는 사람이다.`}};
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state||!Number.isInteger(state.step)||state.step<0||state.step>scenes.length||!Number.isFinite(state.score))state={step:-1,score:50};
const el=id=>document.getElementById(id);function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}
function render(){state.score=Math.max(0,Math.min(100,state.score));el('score').textContent=state.score+'%';el('fill').style.width=state.score+'%';el('meter').setAttribute('aria-valuenow',state.score);el('choices').replaceChildren();const result=el('result');if(state.lastDelta!=null&&state.step>=0){const d=state.lastDelta;result.textContent=d>0?'지훈 호감도 +'+d+'점 획득!':d<0?'지훈 호감도 '+d+'점 감소':'지훈 호감도 변동 없음';result.className='result'+(d<0?' neg':'')}else{result.className='result hidden';result.textContent=''}if(state.step===-1){el('chapter').textContent='INTERACTIVE NOVEL · DOHUN SIDE';el('title').textContent='짝사랑은 교칙 위반인가요?';el('story').textContent='나는 한지훈을 귀여운 후배라고 생각했다.\n\n그 애가 내 곁에서 멀어지기 전까지는.\n\n도훈의 시점으로 다시 시작하는 이야기. 매 장면 3개의 선택지 중 하나를 골라 지훈의 마음을 마주하세요.\n\n호감도 50%에서 시작합니다. 어떤 말이 정답인지는 지훈의 반응을 보고 판단해 주세요.';addButton('이야기 시작하기','',()=>{state.step=0;save();render()});el('status').textContent='10개의 장면 · 선택에 따른 30개의 후속 상황 · 총 4개의 엔딩';}else if(state.step<scenes.length){const s=scenes[state.step];el('chapter').textContent=`CHAPTER ${String(state.step+1).padStart(2,'0')} / ${scenes.length}`;el('title').textContent=s.title;el('story').textContent=(state.after?state.after+'\n\n──────\n\n':'')+s.story;s.choices.forEach(choice=>addButton(choice.label,'',()=>{state.lastDelta=choice.delta;state.after=choice.after;state.score=Math.max(0,Math.min(100,state.score+choice.delta));state.step++;save();render();window.scrollTo({top:0,behavior:'smooth'})}));el('status').textContent='선택 결과는 자동 저장됩니다.';}else{const ending=state.score===100?endings.happy:state.score>=50?endings.normal:state.score>=25?endings.bad1:endings.bad2;el('chapter').textContent='THE END';el('title').textContent=ending.name;el('story').textContent=(state.after?state.after+'\n\n──────\n\n':'')+ending.body;addButton('다시 플레이하기','',reset);el('status').textContent='최종 호감도 '+state.score+'%';}}
function addButton(label,delta,fn){const b=document.createElement('button');b.className='choice';const t=document.createElement('span');t.textContent=label;b.append(t);if(delta){const d=document.createElement('span');d.className='delta'+(delta.startsWith('-')?' neg':'');d.textContent=delta+'점';b.append(d)}b.addEventListener('click',fn);el('choices').append(b)}function reset(){if(!confirm('진행 상황을 지우고 처음부터 시작할까요?'))return;state={step:-1,score:50,lastDelta:null};save();render();window.scrollTo({top:0,behavior:'smooth'})}el('reset').addEventListener('click',reset);render();
</script>
</body></html>
